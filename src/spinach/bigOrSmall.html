<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: #333;
        }
        button {
            width: 500px;
            height: 100px;
        }
        #res {
            font-size: 500px;
            color: red;
        }
    </style>
</head>
<body>
    <button id="btn">大小</button>
    <div id="res"></div>
    <script>
        window.onload = function () {
            const btn = document.getElementById('btn');
            btn.onclick = function () {
                document.getElementById('res').innerHTML = winLoss();
            }
        }
        function winLoss() {
            return Math.random().toString().split('.')[1][0] % 2 === 0 ? '大' : '小'
        }
    </script>
</body>
</html>
